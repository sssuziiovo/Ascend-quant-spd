<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascend Quant interview</title>
<style>
:root{
  --paper:#FFFFFF;
  --sheet:#FFFFFF;
  --rule:#DFE1DE;
  --wash:#F4F5F3;
  --ink:#181B19;
  --soft:#6A716C;
  --faint:#969C97;
  --red:#C1443A;
  --blue:#21486B;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}

.wrap{max-width:680px;margin:0 auto;padding:34px 18px 80px}
.wrapWide{max-width:1060px;margin:0 auto;padding:0 18px 80px}

/* masthead */
.mast{display:flex;align-items:baseline;gap:12px;padding:16px 18px;border-bottom:1px solid var(--rule);
  background:var(--sheet)}
.mast .firm{font-weight:600;letter-spacing:-.01em}
.mast .who{margin-left:auto;color:var(--soft);font-size:14px}
.mast .tabs{display:flex;gap:2px;margin-left:auto}
.mast .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--soft);padding:6px 4px;margin:0 7px}
.mast .tab[aria-current="true"]{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
.grow{flex:1}

/* sheets */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:22px;margin-bottom:16px}
.sheet.tight{padding:16px 18px}
h1{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.28;margin:0 0 12px}
h2{font-size:16px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:600;margin:0 0 6px}
.lede{color:var(--soft);line-height:1.62;margin:0 0 26px;max-width:56ch}
.note{color:var(--soft);font-size:13.5px;line-height:1.6;margin:0 0 14px}
.note:last-child{margin-bottom:0}
.hint{color:var(--faint);font-size:13px}

/* the answer sheet: red margin rule carries the clock */
.book{display:flex;gap:0;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.margin{width:4px;flex:0 0 4px;background:#EAE4E1;position:relative}
.margin i{position:absolute;top:0;left:0;right:0;background:var(--red);transition:height .25s linear}
.leaf{flex:1;min-width:0;padding:20px 22px}
.head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:18px}
.head .qn{color:var(--soft);font-size:13.5px}
.clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:27px;font-weight:600;letter-spacing:-.02em}
.clock.low{color:var(--red)}
.qtext{font-family:var(--serif);font-size:18px;line-height:1.6;white-space:pre-wrap;margin:0 0 20px}

textarea.answer{width:100%;min-height:230px;background:transparent;border:1px solid var(--rule);
  border-radius:3px;padding:14px;font-family:var(--serif);font-size:16px;line-height:1.68;resize:vertical}
textarea.answer:disabled{color:var(--soft);background:var(--wash)}

/* controls */
.field{width:100%;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:10px 12px}
.field::placeholder{color:var(--faint)}
textarea.field{resize:vertical;line-height:1.6}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:3px;padding:10px 16px;font-weight:600}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:500}
.btn.stop{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px;font-weight:500}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.chip{background:transparent;border:1px solid var(--rule);border-radius:3px;padding:6px 11px;font-size:13.5px;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* option doors on the landing page */
.door{display:block;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);
  border-radius:3px;padding:16px 18px;margin-bottom:10px;color:var(--ink)}
.door:hover{border-color:var(--ink)}
.door b{display:block;font-weight:600;margin-bottom:2px}
.door span{color:var(--soft);font-size:13.5px}

/* roster */
.person{border-top:1px solid var(--rule);padding:12px 0}
.person:first-of-type{border-top:none}
.person .line{display:flex;align-items:baseline;gap:10px}
.person b{font-weight:600}
.state{font-size:12.5px;color:var(--soft)}
.state.in{color:#2C6B4F}
.state.forced{color:var(--red)}
.excerpt{font-family:var(--serif);font-size:14px;line-height:1.6;color:#474B49;white-space:pre-wrap;
  margin-top:7px;padding-left:11px;border-left:2px solid var(--rule)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--soft);font-size:12.5px;padding:8px 9px;border-bottom:1px solid var(--rule)}
td{padding:9px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55}
td.a{font-family:var(--serif);font-size:14.5px;white-space:pre-wrap;max-width:440px}
.scroll{overflow-x:auto}

/* waiting */
.hold{text-align:center;padding:64px 14px}
.hold h2{font-size:19px;margin-bottom:9px}
.hold p{color:var(--soft);margin:0;line-height:1.6}
.beat{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2C6B4F;margin-right:9px;
  animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.beat{animation:none;opacity:.7}}

.banner{border:1px solid var(--red);border-left-width:4px;border-radius:3px;padding:12px 14px;
  margin-bottom:16px;font-size:13.5px;line-height:1.6;background:#FCF6F4}
.ok{border-color:#2C6B4F;background:#F4F8F4}

.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.split{grid-template-columns:1.2fr .8fr}}
.footline{color:var(--faint);font-size:12.5px;padding-top:8px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   1. CONFIG. Edit these two lines, nothing else.
   ============================================================ */
var CONFIG = {
  firm: "Ascend Quant",
  adminCode: "ascendquant:3",

  /* To host this as a real website, paste your Firebase Realtime
     Database URL between the quotes. See README for the 4 steps.
     Example: "https://ascend-interview-default-rtdb.firebaseio.com"
     Leave empty to run inside Claude, or for a single-browser test. */
  firebaseUrl: "https://ascend-quant-spd-default-rtdb.firebaseio.com/",

  pollMs: 1500,
  draftMs: 2500
};

/* ============================================================
   2. STORAGE. Three backends, same interface.
   ============================================================ */
var MODE = CONFIG.firebaseUrl ? "firebase" : (typeof window !== "undefined" && window.storage ? "claude" : "local");

function fbUrl(path){ return CONFIG.firebaseUrl.replace(/\/+$/, "") + "/" + path + ".json"; }

var Store = {
  async get(path){
    try{
      if(MODE === "firebase"){
        var r = await fetch(fbUrl(path), {cache:"no-store"});
        if(!r.ok) return null;
        var j = await r.json();
        return j === null ? null : j;
      }
      if(MODE === "claude"){
        var res = await window.storage.get(path.replace(/\//g, ":"), true);
        return res ? JSON.parse(res.value) : null;
      }
      var raw = localStorage.getItem("iv:" + path);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  async set(path, value){
    try{
      if(MODE === "firebase"){
        await fetch(fbUrl(path), {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(value)});
        return true;
      }
      if(MODE === "claude"){
        await window.storage.set(path.replace(/\//g, ":"), JSON.stringify(value), true);
        return true;
      }
      localStorage.setItem("iv:" + path, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  },
  /* every value one level under a path */
  async children(path){
    try{
      if(MODE === "firebase"){
        var r = await fetch(fbUrl(path), {cache:"no-store"});
        if(!r.ok) return [];
        var j = await r.json();
        return j ? Object.keys(j).map(function(k){ return j[k]; }) : [];
      }
      if(MODE === "claude"){
        var pre = path.replace(/\//g, ":") + ":";
        var res = await window.storage.list(pre, true);
        var keys = (res && res.keys) || [];
        var out = [];
        for(var i=0;i<keys.length;i++){
          var k = typeof keys[i] === "string" ? keys[i] : (keys[i] && keys[i].key);
          if(!k) continue;
          var v = await window.storage.get(k, true).catch(function(){ return null; });
          if(v) out.push(JSON.parse(v.value));
        }
        return out;
      }
      var pre2 = "iv:" + path + "/";
      var arr = [];
      for(var n=0;n<localStorage.length;n++){
        var key = localStorage.key(n);
        if(key && key.indexOf(pre2) === 0){
          try{ arr.push(JSON.parse(localStorage.getItem(key))); }catch(e2){}
        }
      }
      return arr;
    }catch(e){ return []; }
  },
  async remove(path){
    try{
      if(MODE === "firebase"){
        var r = await fetch(fbUrl(path), {method:"DELETE"});
        return r.ok;
      }
      if(MODE === "local"){
        var exact = "iv:" + path;
        var prefix = exact + "/";
        var keys = [];
        for(var i=0;i<localStorage.length;i++){
          var k = localStorage.key(i);
          if(k === exact || (k && k.indexOf(prefix) === 0)) keys.push(k);
        }
        keys.forEach(function(k){ localStorage.removeItem(k); });
        return true;
      }
      return false;
    }catch(e){ return false; }
  }
};

/* private to this browser: who am I, am I unlocked */
var Mine = {
  async get(key){
    try{
      if(MODE === "claude"){
        var r = await window.storage.get("my:" + key, false);
        return r ? JSON.parse(r.value) : null;
      }
      var raw = localStorage.getItem("ivme:" + key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      if(MODE === "claude"){ await window.storage.set("my:" + key, JSON.stringify(value), false); return true; }
      localStorage.setItem("ivme:" + key, JSON.stringify(value));
      return true;
    }catch(e){ return false; }
  }
};

var P = {
  index: "sessions/index",
  live: "live",
  state: function(sid){ return "s/" + sid + "/state"; },
  cand: function(sid, cid){ return "s/" + sid + "/c/" + cid; },
  room: function(sid){ return "s/" + sid + "/c"; }
};

/* ============================================================
   3. SMALL HELPERS
   ============================================================ */
function uid(p){ return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,6); }
function clock(ms){
  var s = Math.max(0, Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}
function stamp(t){ return t ? new Date(t).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : ""; }
function hhmmss(t){ return t ? new Date(t).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"}) : ""; }
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function el(html){ var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
function $(sel, root){ return (root||document).querySelector(sel); }
function toCSV(rows){
  return rows.map(function(r){
    return r.map(function(v){
      var s = v === null || v === undefined ? "" : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(",");
  }).join("\r\n");
}
function download(filename, text){
  try{
    var blob = new Blob(["\uFEFF" + text], {type:"text/csv;charset=utf-8;"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    return true;
  }catch(e){ return false; }
}
function copyText(text){
  try{
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function modeBanner(){
  if(MODE === "firebase") return "";
  if(MODE === "claude") return "";
  return '<div class="banner">Local mode. This copy has no database, so questions and answers stay inside this one browser. '
       + 'The candidate will not see anything from another device. Add a Firebase URL in CONFIG before a real interview.</div>';
}

var app = document.getElementById("app");
var ticker = null, poller = null, draftTimer = null;

function stopTimers(){
  if(ticker){ clearInterval(ticker); ticker = null; }
  if(poller){ clearInterval(poller); poller = null; }
  if(draftTimer){ clearInterval(draftTimer); draftTimer = null; }
}

/* ============================================================
   4. LANDING
   ============================================================ */
function landing(){
  stopTimers();
  app.innerHTML =
    '<div class="wrap">'
    + '<p class="hint" style="margin:0 0 30px">' + esc(CONFIG.firm) + '</p>'
    + modeBanner()
    + '<h1>Thank you for coming to the ' + esc(CONFIG.firm) + ' final round interview.</h1>'
    + '<p class="lede">Questions are sent one at a time and each is timed. When the clock reaches zero your answer '
    + 'submits on its own, so write as you go rather than saving it all for the end.</p>'
    + '<button class="door" id="asCand"><b>I am here to interview</b><span>Enter your name and wait for the first question</span></button>'
    + '<button class="door" id="asHost"><b>Run the interview</b><span>Passcode required</span></button>'
    + '</div>';
  $("#asCand").onclick = candidateView;
  $("#asHost").onclick = hostGate;
}

/* ============================================================
   5. INTERVIEWER
   ============================================================ */
var H = { sessions:[], liveId:null, sid:null, st:null, cands:[], tab:"live", lastQ:"", note:"" };

async function hostGate(){
  stopTimers();
  var unlocked = await Mine.get("unlocked");
  if(unlocked === true) return hostBoot();
  app.innerHTML =
    '<div class="wrap">'
    + '<p class="hint" style="margin:0 0 30px">' + esc(CONFIG.firm) + '</p>'
    + '<h1>Interviewer console</h1>'
    + '<p class="lede">Enter the passcode to send questions and collect answers.</p>'
    + '<div class="sheet">'
    + '<input class="field" id="pw" type="password" placeholder="Passcode" autocomplete="off">'
    + '<p class="note" id="pwErr" style="color:var(--red);display:none"></p>'
    + '<div class="row" style="margin-top:14px">'
    + '<button class="btn" id="go">Unlock</button>'
    + '<button class="btn quiet" id="back">Back</button>'
    + '</div></div></div>';
  var tryIt = async function(){
    if($("#pw").value === CONFIG.adminCode){
      await Mine.set("unlocked", true);
      hostBoot();
    }else{
      var e = $("#pwErr");
      e.style.display = "block";
      e.textContent = "That passcode does not match.";
    }
  };
  $("#go").onclick = tryIt;
  $("#back").onclick = landing;
  $("#pw").onkeydown = function(ev){ if(ev.key === "Enter") tryIt(); };
  $("#pw").focus();
}

async function hostBoot(){
  var idxRaw = await Store.get(P.index);
  H.sessions = Array.isArray(idxRaw) ? idxRaw : (idxRaw ? Object.keys(idxRaw).map(function(k){ return idxRaw[k]; }) : []);
  var live = await Store.get(P.live);
  H.liveId = live && live.sid ? live.sid : null;
  H.sid = H.liveId || (H.sessions.length ? H.sessions[H.sessions.length-1].id : null);
  H.st = H.sid ? await Store.get(P.state(H.sid)) : null;
  H.cands = H.sid ? await Store.children(P.room(H.sid)) : [];
  hostRender();
  stopTimers();
  ticker = setInterval(hostTick, 250);
  poller = setInterval(hostPoll, CONFIG.pollMs);
}

var polling = false;
async function hostPoll(){
  if(polling || !H.sid) return;
  polling = true;
  H.cands = await Store.children(P.room(H.sid));
  H.cands.sort(function(a,b){ return (a.joinedAt||0) - (b.joinedAt||0); });
  if(H.tab === "live") paintRoster();
  polling = false;
}

/* archive a question a few seconds after it expires, so every
   candidate has had time to auto submit first */
var archiving = false;
async function hostTick(){
  var q = H.st && H.st.activeQ;
  if(q){
    var remain = q.endsAt - Date.now();
    var bar = $("#hBar"), cl = $("#hClock");
    if(bar) bar.style.height = Math.max(0, Math.min(100, (remain/(q.durationSec*1000))*100)) + "%";
    if(cl){
      cl.textContent = clock(remain);
      cl.className = "clock" + (remain < q.durationSec*200 ? " low" : "");
    }
    if(Date.now() > q.endsAt + 3000 && !archiving){
      archiving = true;
      await closeQuestion(true);
      archiving = false;
    }
  }
}

async function saveState(next){
  H.st = next;
  await Store.set(P.state(next.sid), next);
}

async function newSession(title){
  var id = uid("ses");
  var rec = {id:id, title:title, createdAt:Date.now()};
  H.sessions = H.sessions.concat([rec]);
  await Store.set(P.index, H.sessions);
  var fresh = {sid:id, title:title, activeQ:null, asked:[], status:"lobby", createdAt:Date.now()};
  await Store.set(P.state(id), fresh);
  await Store.set(P.live, {sid:id, at:Date.now()});
  H.sid = id; H.liveId = id; H.st = fresh; H.cands = []; H.tab = "live";
  H.note = 'Started "' + title + '" at question 1. Every earlier session keeps its answers.';
  hostRender();
}

async function makeLive(id){
  await Store.set(P.live, {sid:id, at:Date.now()});
  H.liveId = id;
  H.note = "Candidates are now pointed at this session.";
  hostRender();
}

async function openSession(id){
  H.sid = id;
  H.st = await Store.get(P.state(id));
  H.cands = await Store.children(P.room(id));
  hostRender();
}

async function sendQuestion(text, seconds){
  var start = Date.now();
  var q = {
    id: uid("q"),
    index: (H.st.asked || []).length + 1,
    text: text,
    durationSec: seconds,
    startedAt: start,
    endsAt: start + seconds*1000
  };
  H.note = "";
  await saveState(Object.assign({}, H.st, {activeQ:q, status:"question", asked:H.st.asked || []}));
  hostRender();
}

async function closeQuestion(auto){
  if(!H.st || !H.st.activeQ) return;
  var q = H.st.activeQ;
  var asked = (H.st.asked || []).concat([Object.assign({}, q, {endedAt: auto ? q.endsAt : Date.now()})]);
  await saveState(Object.assign({}, H.st, {activeQ:null, asked:asked, status:"waiting"}));
  if(!auto) H.note = "Question closed. Candidates are on the waiting screen.";
  hostRender();
}

async function addTime(extra){
  if(!H.st || !H.st.activeQ) return;
  var q = Object.assign({}, H.st.activeQ, {
    endsAt: H.st.activeQ.endsAt + extra*1000,
    durationSec: H.st.activeQ.durationSec + extra
  });
  await saveState(Object.assign({}, H.st, {activeQ:q}));
}

function answerOf(c, q){ return c.answers && c.answers[q.id] ? c.answers[q.id] : null; }

function hostRender(){
  var st = H.st, q = st && st.activeQ;
  var tabs = [["live","Live"],["results","Answers"],["sessions","Sessions"]].map(function(t){
    return '<button class="tab" data-tab="' + t[0] + '" aria-current="' + (H.tab===t[0]) + '">' + t[1] + '</button>';
  }).join("");

  var body = "";
  if(!st){
    body = '<div class="sheet"><h2>No interviews yet</h2>'
      + '<p class="note">Create one to open a session. Candidates always join whichever session is live.</p>'
      + '<div class="row"><input class="field" id="newTitle" style="flex:1 1 240px" placeholder="Session name, for example Final round, Tuesday 2pm">'
      + '<button class="btn" id="mk">Create interview</button></div></div>';
  } else if(H.tab === "live"){
    body = (H.liveId !== H.sid
      ? '<div class="banner">You are looking at an earlier session. Candidates cannot see questions sent from here. '
        + '<button class="btn sm" id="mkLive" style="margin-top:8px">Point candidates at this session</button></div>'
      : "")
      + '<div class="split"><div>' + (q ? liveQuestionPanel(q) : composerPanel()) + '</div>'
      + '<div><div class="sheet"><h2>In the room</h2>'
      + '<p class="note">Updates every ' + (CONFIG.pollMs/1000).toFixed(1) + ' seconds.</p>'
      + '<div id="roster"></div></div></div></div>';
  } else if(H.tab === "results"){
    body = resultsPanel();
  } else {
    body = sessionsPanel();
  }

  app.innerHTML =
    '<div class="mast"><span class="firm">' + esc(CONFIG.firm) + '</span>'
    + '<span class="hint">' + (H.liveId === H.sid ? "live" : "not live") + '</span>'
    + '<div class="tabs">' + tabs + '<button class="tab" id="leave">Exit</button></div></div>'
    + '<div class="wrapWide" style="padding-top:18px">'
    + modeBanner()
    + (H.note ? '<div class="banner ok">' + esc(H.note) + '</div>' : "")
    + body + '</div>';

  Array.prototype.forEach.call(document.querySelectorAll(".tab[data-tab]"), function(b){
    b.onclick = function(){ H.tab = b.getAttribute("data-tab"); H.note = ""; hostRender(); };
  });
  $("#leave").onclick = landing;

  if($("#mk")) $("#mk").onclick = function(){
    var t = $("#newTitle").value.trim() || ("Interview " + new Date().toLocaleDateString());
    newSession(t);
  };
  if($("#mkLive")) $("#mkLive").onclick = function(){ makeLive(H.sid); };

  wireComposer();
  wireResults();
  wireSessions();
  if(H.tab === "live") paintRoster();
}

function composerPanel(){
  var n = ((H.st && H.st.asked) || []).length + 1;
  var chips = [60,120,180,300,600].map(function(s){
    return '<button class="chip" data-sec="' + s + '" aria-pressed="false">' + (s<60 ? s+"s" : (s/60)+" min") + '</button>';
  }).join("");
  return '<div class="sheet"><h2>Send question ' + n + '</h2>'
    + '<p class="note">Candidates sit on the waiting screen until you send this.</p>'
    + '<textarea class="field" id="qText" rows="7" placeholder="Type the question exactly as the candidate should read it."></textarea>'
    + '<div class="row" style="margin-top:12px">' + chips
    + '<input class="field" id="qSec" style="width:120px" placeholder="or seconds" inputmode="numeric"></div>'
    + '<div class="row" style="margin-top:16px"><button class="btn" id="send">Send to candidates</button>'
    + '<span class="hint" id="secLabel">180 seconds on the clock</span></div></div>';
}

function liveQuestionPanel(q){
  return '<div class="book"><div class="margin"><i id="hBar" style="height:100%"></i></div><div class="leaf">'
    + '<div class="head"><span class="qn">Question ' + q.index + ' is open</span>'
    + '<span class="clock" id="hClock">' + clock(q.endsAt - Date.now()) + '</span></div>'
    + '<p class="qtext">' + esc(q.text) + '</p>'
    + '<div class="row"><button class="btn stop" id="endQ">End question now</button>'
    + '<button class="btn quiet sm" id="p30">Add 30s</button>'
    + '<button class="btn quiet sm" id="p60">Add 60s</button></div></div></div>';
}

var pickedSec = 180;
function wireComposer(){
  if(!$("#qText")) {
    if($("#endQ")) $("#endQ").onclick = function(){ closeQuestion(false); };
    if($("#p30")) $("#p30").onclick = function(){ addTime(30); };
    if($("#p60")) $("#p60").onclick = function(){ addTime(60); };
    return;
  }
  var chips = document.querySelectorAll(".chip[data-sec]");
  var custom = $("#qSec"), label = $("#secLabel");
  function refresh(){
    var c = parseInt(custom.value, 10);
    var val = c > 0 ? c : pickedSec;
    Array.prototype.forEach.call(chips, function(b){
      b.setAttribute("aria-pressed", String(!(c > 0) && parseInt(b.getAttribute("data-sec"),10) === pickedSec));
    });
    label.textContent = Math.max(10, val) + " seconds on the clock";
  }
  Array.prototype.forEach.call(chips, function(b){
    b.onclick = function(){ pickedSec = parseInt(b.getAttribute("data-sec"),10); custom.value = ""; refresh(); };
  });
  custom.oninput = function(){ custom.value = custom.value.replace(/[^0-9]/g,""); refresh(); };
  refresh();
  $("#send").onclick = function(){
    var text = $("#qText").value.trim();
    if(!text) return;
    if(H.liveId !== H.sid){ H.note = "Point candidates at this session first."; hostRender(); return; }
    var c = parseInt(custom.value,10);
    sendQuestion(text, Math.max(10, c > 0 ? c : pickedSec));
  };
}

function paintRoster(){
  var box = $("#roster");
  if(!box) return;
  var q = H.st && H.st.activeQ;
  if(!H.cands.length){ box.innerHTML = '<p class="hint">Nobody has joined yet.</p>'; return; }
  box.innerHTML = H.cands.map(function(c){
    var a = q ? answerOf(c, q) : null;
    var draft = c.draft && q && c.draft.qid === q.id ? c.draft.text : "";
    var status = !q ? '<span class="state">waiting</span>'
      : a ? '<span class="state ' + (a.auto ? "forced" : "in") + '">' + (a.auto ? "time called" : "submitted") + '</span>'
      : '<span class="state">answering</span>';
    var sub = a ? "at " + hhmmss(a.submittedAt)
      : draft ? draft.trim().split(/\s+/).length + " words so far"
      : q ? "nothing typed yet" : "";
    if(c.focusLosses) sub += (sub ? ", " : "") + "left the tab " + c.focusLosses + " times";
    var show = a ? (a.text || "(blank)") : draft;
    return '<div class="person"><div class="line"><b>' + esc(c.name) + '</b><span class="grow"></span>' + status + '</div>'
      + (sub ? '<div class="state">' + esc(sub) + '</div>' : "")
      + (show ? '<div class="excerpt">' + esc(show) + '</div>' : "") + '</div>';
  }).join("");
}

function exportRows(){
  var rows = [["Session","Question","Prompt","Candidate","Answer","Submitted","Time called","Seconds used","Tab switches"]];
  var asked = (H.st && H.st.asked) || [];
  asked.forEach(function(q){
    H.cands.forEach(function(c){
      var a = answerOf(c, q);
      rows.push([
        H.st.title, q.index, q.text, c.name,
        a ? a.text : "",
        a ? new Date(a.submittedAt).toLocaleString() : "no submission",
        a ? (a.auto ? "yes" : "no") : "",
        a ? Math.max(0, Math.round((a.submittedAt - q.startedAt)/1000)) : "",
        c.focusLosses || 0
      ]);
    });
  });
  return rows;
}

function resultsPanel(){
  var asked = (H.st && H.st.asked) || [];
  var head = '<div class="sheet tight"><h2>' + esc(H.st.title) + '</h2>'
    + '<p class="note">' + asked.length + ' closed question' + (asked.length===1?"":"s") + ', '
    + H.cands.length + ' candidate' + (H.cands.length===1?"":"s") + ', started ' + esc(stamp(H.st.createdAt)) + '</p>'
    + '<div class="row"><button class="btn sm" id="csv"' + (asked.length?"":" disabled") + '>Download CSV</button>'
    + '<button class="btn quiet sm" id="cp"' + (asked.length?"":" disabled") + '>Copy for Excel</button></div></div>';
  if(!asked.length) return head + '<p class="hint">Nothing here yet. Answers land as soon as a question closes.</p>';
  return head + asked.map(function(q){
    return '<div class="sheet"><h3>Question ' + q.index + '</h3>'
      + '<p class="qtext" style="font-size:16px;margin-bottom:14px">' + esc(q.text) + '</p>'
      + '<div class="scroll"><table><thead><tr><th style="width:150px">Candidate</th><th>Answer</th><th style="width:110px">Used</th></tr></thead><tbody>'
      + H.cands.map(function(c){
          var a = answerOf(c, q);
          return '<tr><td>' + esc(c.name) + '</td>'
            + '<td class="a">' + (a ? esc(a.text || "(blank)") : '<span class="hint">no submission</span>') + '</td>'
            + '<td class="state">' + (a ? Math.max(0, Math.round((a.submittedAt - q.startedAt)/1000)) + "s" + (a.auto ? ", called" : "") : "-") + '</td></tr>';
        }).join("")
      + '</tbody></table></div></div>';
  }).join("");
}

function wireResults(){
  if($("#csv")) $("#csv").onclick = function(){
    var ok = download(H.st.title.replace(/[^\w\- ]/g,"") + ".csv", toCSV(exportRows()));
    H.note = ok ? "CSV downloaded. Open it in Excel." : "The download was blocked. Use Copy for Excel instead.";
    hostRender();
  };
  if($("#cp")) $("#cp").onclick = function(){
    var ok = copyText(toCSV(exportRows()));
    H.note = ok ? "Copied. Paste into Excel, then Data, Text to Columns, Comma." : "Copy failed. Select the table by hand.";
    hostRender();
  };
}

async function clearSessionAnswers(id){
  var rec = H.sessions.find(function(s){ return s.id === id; });
  var title = rec ? rec.title : "this session";
  if(!confirm('Delete all candidate answers from "' + title + '"? This cannot be undone.')) return;

  var ok = await Store.remove(P.room(id));
  if(!ok){
    alert("Could not delete the answers. Check Firebase permissions and try again.");
    return;
  }

  if(H.sid === id) H.cands = [];
  H.note = 'Deleted all candidate answers from "' + title + '". The session and its questions were kept.';
  hostRender();
}

function sessionsPanel(){
  var list = H.sessions.slice().reverse().map(function(s){
    return '<div class="person"><div class="line"><b>' + esc(s.title) + '</b><span class="grow"></span>'
      + (H.liveId === s.id ? '<span class="state in">live</span>' : "")
      + (H.sid === s.id ? '<span class="state">open</span>' : "") + '</div>'
      + '<div class="state">' + esc(stamp(s.createdAt)) + '</div>'
      + '<div class="row" style="margin-top:9px">'
      + '<button class="btn quiet sm" data-open="' + s.id + '">View answers</button>'
      + (H.liveId === s.id ? "" : '<button class="btn quiet sm" data-live="' + s.id + '">Make live</button>')
      + '<button class="btn stop sm" data-clear="' + s.id + '">Delete answers</button>'
      + '</div></div>';
  }).join("");
  return '<div class="sheet"><h2>Start a new interview</h2>'
    + '<p class="note">Question numbering restarts at 1. Nothing from earlier sessions is touched.</p>'
    + '<div class="row"><input class="field" id="newTitle2" style="flex:1 1 240px" placeholder="Session name, for example Final round, Tuesday 2pm">'
    + '<button class="btn" id="mk2">Create interview</button></div></div>'
    + '<div class="sheet"><h2>All sessions</h2>' + (list || '<p class="hint">None yet.</p>') + '</div>';
}

function wireSessions(){
  if($("#mk2")) $("#mk2").onclick = function(){
    var t = $("#newTitle2").value.trim() || ("Interview " + new Date().toLocaleDateString());
    newSession(t);
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(b){
    b.onclick = function(){ H.tab = "results"; openSession(b.getAttribute("data-open")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-live]"), function(b){
    b.onclick = function(){ makeLive(b.getAttribute("data-live")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-clear]"), function(b){
    b.onclick = function(){ clearSessionAnswers(b.getAttribute("data-clear")); };
  });
}

/* ============================================================
   6. CANDIDATE
   ============================================================ */
var C = { me:null, rec:null, st:null, submitted:null, lastQ:"", dirty:false, painted:"" };

async function candidateView(){
  stopTimers();
  var saved = await Mine.get("current");
  var live = await Store.get(P.live);
  var lid = live && live.sid ? live.sid : null;
  if(saved && lid && saved.sid === lid){
    var mine = await Store.get(P.cand(lid, saved.cid));
    if(mine){
      C.me = saved; C.rec = mine;
      C.st = await Store.get(P.state(lid));
      return candStart();
    }
  }
  joinScreen(saved && saved.name ? saved.name : "");
}

function joinScreen(prefill){
  app.innerHTML =
    '<div class="wrap">'
    + '<p class="hint" style="margin:0 0 30px">' + esc(CONFIG.firm) + '</p>'
    + modeBanner()
    + '<h1>Thank you for coming to the ' + esc(CONFIG.firm) + ' final round interview.</h1>'
    + '<p class="lede">Questions arrive one at a time and each one is timed. When the clock hits zero whatever is in '
    + 'the box is submitted for you, so keep writing rather than saving it for the end.</p>'
    + '<div class="sheet"><label class="note" for="nm">Your full name</label>'
    + '<input class="field" id="nm" value="' + esc(prefill) + '" placeholder="First and last name" autocomplete="name">'
    + '<div class="row" style="margin-top:15px"><button class="btn" id="join">Join interview</button>'
    + '<button class="btn quiet" id="back">Back</button></div></div></div>';
  var go = async function(){
    var n = $("#nm").value.trim();
    if(!n) return;
    $("#join").disabled = true; $("#join").textContent = "Joining";
    var live = await Store.get(P.live);
    var lid = live && live.sid ? live.sid : null;
    if(!lid){
      $("#join").disabled = false; $("#join").textContent = "Join interview";
      var w = el('<p class="note" style="color:var(--red)">The interviewer has not opened a session yet. Try again in a moment.</p>');
      $("#nm").parentNode.appendChild(w);
      return;
    }
    await joinSession(lid, n);
    candStart();
  };
  $("#join").onclick = go;
  $("#back").onclick = landing;
  $("#nm").onkeydown = function(e){ if(e.key === "Enter") go(); };
  $("#nm").focus();
}

async function joinSession(sid, name){
  var cid = uid("c");
  var rec = {cid:cid, name:name, joinedAt:Date.now(), answers:{}, focusLosses:0, draft:null};
  await Store.set(P.cand(sid, cid), rec);
  await Mine.set("current", {sid:sid, cid:cid, name:name});
  C.me = {sid:sid, cid:cid, name:name};
  C.rec = rec;
  C.submitted = null;
  C.lastQ = "";
  C.painted = "";
  C.st = await Store.get(P.state(sid));
}

function candStart(){
  stopTimers();
  candPaint();
  ticker = setInterval(candTick, 250);
  poller = setInterval(candPoll, CONFIG.pollMs);
  draftTimer = setInterval(saveDraft, CONFIG.draftMs);
  document.addEventListener("visibilitychange", onHide);
}

function onHide(){
  if(document.visibilityState !== "hidden") return;
  if(!C.rec || !C.st || !C.st.activeQ) return;
  C.rec.focusLosses = (C.rec.focusLosses || 0) + 1;
  Store.set(P.cand(C.me.sid, C.me.cid), C.rec);
}

var cPolling = false;
async function candPoll(){
  if(cPolling || !C.me) return;
  cPolling = true;
  var live = await Store.get(P.live);
  var lid = live && live.sid ? live.sid : null;
  if(lid && lid !== C.me.sid){
    /* A new interview went live. Kick the candidate back to the join screen
       instead of automatically carrying them into the new session. */
    var oldName = C.me.name || "";
    cPolling = false;
    stopTimers();
    document.removeEventListener("visibilitychange", onHide);
    await Mine.set("current", {name: oldName});
    C.me = null;
    C.rec = null;
    C.st = null;
    C.submitted = null;
    C.lastQ = "";
    C.lastQObj = null;
    C.dirty = false;
    C.painted = "";
    joinScreen(oldName);
    return;
  }
  var next = await Store.get(P.state(C.me.sid));
  if(next) C.st = next;
  cPolling = false;
  candPaint();
}

function currentText(){ var t = $("#ans"); return t ? t.value : ""; }

async function submitAnswer(q, text, auto){
  if(!q || !C.rec || !C.me) return;
  if(C.rec.answers && C.rec.answers[q.id]) return;
  C.rec.answers = C.rec.answers || {};
  C.rec.answers[q.id] = {qIndex:q.index, text:text, submittedAt:Date.now(), auto:!!auto};
  C.rec.draft = null;
  C.submitted = q.id;
  await Store.set(P.cand(C.me.sid, C.me.cid), C.rec);
  candPaint();
}

function saveDraft(){
  var q = C.st && C.st.activeQ;
  if(!q || C.submitted === q.id || !C.dirty || !C.rec) return;
  C.dirty = false;
  C.rec.draft = {qid:q.id, text:currentText(), at:Date.now()};
  Store.set(P.cand(C.me.sid, C.me.cid), C.rec);
}

function candTick(){
  var q = C.st && C.st.activeQ;
  if(!q || C.submitted === q.id) return;
  var remain = q.endsAt - Date.now();
  var bar = $("#cBar"), cl = $("#cClock");
  if(bar) bar.style.height = Math.max(0, Math.min(100, (remain/(q.durationSec*1000))*100)) + "%";
  if(cl){
    cl.textContent = clock(remain);
    cl.className = "clock" + (remain < q.durationSec*200 ? " low" : "");
  }
  if(remain <= 0) submitAnswer(q, currentText(), true);
}

function candPaint(){
  var q = C.st && C.st.activeQ;

  /* the question was pulled before we sent anything: push the box */
  if(!q && C.lastQ && C.submitted !== C.lastQ && C.lastQObj){
    submitAnswer(C.lastQObj, currentText(), true);
    return;
  }

  if(q){
    C.lastQObj = q;
    var mine = C.rec && C.rec.answers ? C.rec.answers[q.id] : null;
    if(mine) C.submitted = q.id;
  }

  var key = q ? (q.id + (C.submitted === q.id ? ":done" : ":open")) : "wait";
  if(key === C.painted) return;    /* never redraw while they are typing */
  C.painted = key;
  C.lastQ = q ? q.id : C.lastQ;

  var top = '<div class="mast"><span class="firm">' + esc(CONFIG.firm) + '</span>'
    + '<span class="who">' + esc(C.me.name) + '</span></div>';

  if(q && C.submitted !== q.id){
    var draft = C.rec && C.rec.draft && C.rec.draft.qid === q.id ? C.rec.draft.text : "";
    app.innerHTML = top + '<div class="wrap" style="padding-top:20px">'
      + '<div class="book"><div class="margin"><i id="cBar" style="height:100%"></i></div><div class="leaf">'
      + '<div class="head"><span class="qn">Question ' + q.index + '</span>'
      + '<span class="clock" id="cClock">' + clock(q.endsAt - Date.now()) + '</span></div>'
      + '<p class="qtext">' + esc(q.text) + '</p>'
      + '<textarea class="answer" id="ans" placeholder="Write your answer here. It sends on its own when the clock ends."></textarea>'
      + '<div class="row" style="margin-top:14px"><button class="btn" id="sub">Submit answer</button>'
      + '<span class="hint">Submitting early locks your answer and ends this question for you.</span>'
      + '</div></div></div></div>';
    var ta = $("#ans");
    ta.value = draft;
    ta.oninput = function(){ C.dirty = true; };
    ta.focus();
    $("#sub").onclick = function(){ submitAnswer(q, currentText(), false); };
    return;
  }

  if(q && C.submitted === q.id){
    var sent = C.rec.answers[q.id].text || "(blank)";
    app.innerHTML = top + '<div class="wrap" style="padding-top:20px"><div class="sheet">'
      + '<div class="hold"><h2>Answer submitted</h2><p>Question ' + q.index + ' is locked. Hold tight for the next one.</p></div>'
      + '<div style="border-top:1px solid var(--rule);padding-top:16px">'
      + '<p class="note">What you sent</p>'
      + '<p class="qtext" style="font-size:15.5px;color:#474B49;margin:0">' + esc(sent) + '</p>'
      + '</div></div></div>';
    return;
  }

  var done = (C.st && C.st.asked ? C.st.asked.length : 0);
  app.innerHTML = top + '<div class="wrap" style="padding-top:20px"><div class="sheet"><div class="hold">'
    + '<h2><span class="beat"></span>Waiting for the next question</h2>'
    + '<p>' + (done
        ? done + ' question' + (done===1?"":"s") + ' done. The next one appears here on its own.'
        : 'The first question appears here on its own. There is no need to refresh.')
    + '</p></div></div></div>';
}

/* ============================================================
   7. GO
   ============================================================ */
landing();
</script>
